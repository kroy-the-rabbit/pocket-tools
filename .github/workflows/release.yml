# SPDX-License-Identifier: GPL-3.0-or-later
# Build three OS artifacts and stage a draft release. The maintainer signs
# the downloads locally with the normal personal key before publishing.
# The signing private key is not used by this workflow.
# macOS retains its existing ad-hoc/optional Developer ID signing flow.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  RELEASE_BRANCH: main

jobs:
  # A tag fires this workflow wherever it was made: `on: push: tags` has no
  # branch filter and GitHub offers none, so tagging a scratch branch would
  # otherwise publish it as a release. This proves the tagged commit is on the
  # release branch before anything else runs.
  #
  # Its own job rather than a step inside the build, so the refusal costs
  # seconds instead of failing after three runners have built and signed.
  #
  # The branch is named in env rather than written into the check, because it
  # has moved once already: all three repositories are on main now.
  guard:
    runs-on: ubuntu-latest
    steps:
      # Full history: the ancestry test needs the branch and the tag in the
      # same clone, and a shallow one has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the release date
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import datetime, re, sys
          tag = sys.argv[1]
          match = re.fullmatch(r"v0\.9999\.([0-9]{8})", tag)
          if not match:
              raise SystemExit("Expected v0.9999.YYYYMMDD")
          datetime.datetime.strptime(match[1], "%Y%m%d")
          PY

      - name: Releases come from ${{ env.RELEASE_BRANCH }}
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "$GITHUB_REF_NAME is on $RELEASE_BRANCH"
          else
            echo "::error::${GITHUB_REF_NAME} is not on ${RELEASE_BRANCH}." \
                 "Releases are built from that branch only; merge it first" \
                 "and tag the merge."
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the bootloader links against the runner's
          # glibc, and building on 24.04 produces a binary that will not start
          # on anything older.
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
          # Apple Silicon only. The macos-13 Intel runners are gone, and an
          # Intel build is not worth keeping a second macOS job alive for.
          - runner: macos-14
            os: macos
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tk, where it is not already there
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk tk

      - name: Work out the version
        id: v
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        shell: bash
        run: |
          python - "${{ steps.v.outputs.version }}" <<'PY'
          import pathlib, sys
          p = pathlib.Path("cheatgui/version.py")
          s = p.read_text()
          old = 'VERSION = "0.0.0-dev"'
          assert s.count(old) == 1, "version.py no longer says what it did"
          p.write_text(s.replace(old, f'VERSION = "{sys.argv[1]}"'))
          PY
          grep -n '^VERSION' cheatgui/version.py

      - name: Build the macOS icon from the committed iconset
        if: matrix.os == 'macos'
        run: |
          # iconutil ships with macOS and is the only thing that writes a real
          # .icns; ImageMagick will write a PNG under that name instead. The
          # PNGs it needs are committed, so no renderer is required here.
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
          file assets/icon.icns

      - run: pip install pyinstaller certifi

      - name: Build
        shell: bash
        env:
          POCKET_CHEATS_VERSION: ${{ steps.v.outputs.version }}
        run: |
          pyinstaller --clean --noconfirm \
            --distpath dist --workpath build/pyi packaging/pocket-tools.spec
          ls -l dist/

      # -------------------------------------------------------------- macOS --
      - name: Is there a Developer ID to sign with?
        if: matrix.os == 'macos'
        id: mac_signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PASS" ] && [ -n "$TEAM" ] && \
             [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing secrets; the macOS build will be ad-hoc signed and not notarized."
          fi

      - name: Import the Developer ID certificate
        if: matrix.os == 'macos' && steps.mac_signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign the app
        if: matrix.os == 'macos'
        shell: bash
        run: |
          APP="dist/Pocket Tools.app"
          test -d "$APP"
          if [ "${{ steps.mac_signing.outputs.enabled }}" = "true" ]; then
            IDENTITY=$(security find-identity -v -p codesigning \
              "$SIGNING_KEYCHAIN" \
              | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)
            [ -n "$IDENTITY" ] || { echo "no Developer ID in the keychain"; exit 1; }
            codesign --force --deep --options runtime --timestamp \
              --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            # Ad-hoc. Apple Silicon refuses to run an unsigned binary at all,
            # so this is the difference between "Gatekeeper warns" and "the app
            # is killed on launch". It is not a trust signature.
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --verbose "$APP" || true
          fi

      - name: Notarize
        if: matrix.os == 'macos' && steps.mac_signing.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="dist/Pocket Tools.app"
          ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          P8="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          echo "$KEY" | base64 --decode > "$P8"
          xcrun notarytool submit "$ZIP" --key "$P8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --wait
          xcrun stapler staple "$APP"

      # ------------------------------------------------------------- naming --
      - name: Name the artifact
        id: name
        shell: bash
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          base="pocket-tools-${V}-${{ matrix.os }}-${{ matrix.arch }}"
          case "${{ matrix.os }}" in
            linux)
              mv dist/pocket-tools "out/${base}"
              chmod +x "out/${base}"
              ;;
            windows)
              mv dist/pocket-tools.exe "out/${base}.exe"
              ;;
            macos)
              # A zip, because a .app is a directory and a release asset is a
              # file. ditto keeps the bundle's symlinks and signature intact,
              # which a plain zip does not.
              ditto -c -k --keepParent "dist/Pocket Tools.app" "out/${base}.zip"
              ;;
          esac
          ls -l out/
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    # workflow_dispatch builds the matrix so a change here can be tested, but
    # there is no tag to attach anything to and nothing to publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect
        run: |
          mkdir -p artifacts
          find staging -type f -exec mv {} artifacts/ \;
          ls -l artifacts/

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          body_path: .github/release-notes.md
